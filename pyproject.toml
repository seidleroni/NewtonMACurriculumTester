[project]
name = "mathkids"
version = "0.1.0"
description = "Local-first daily math practice for kids, grounded in the Newton MA / Massachusetts framework curriculum."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "markupsafe>=2.1",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.scripts]
mathkids = "mathkids.app:main"
mathkids-seed = "mathkids.seed:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.4",
    "uvicorn[standard]>=0.29",
    "workers-py",
    "workers-runtime-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathkids"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
